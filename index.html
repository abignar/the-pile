<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Pile</title>
<meta name="description" content="They just keep falling.">
<meta property="og:title" content="The Pile">
<meta property="og:description" content="They just keep falling.">
<meta property="og:url" content="https://cockpile.com/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://cockpile.com/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Sans:wght@500;700&family=Press+Start+2P&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Sans:wght@500;700&family=Press+Start+2P&display=swap"></noscript>
<script defer src="js/planck.min.js"></script>
<style>
  :root{
    --bg1:#fff4e3; --bg2:#ffd9c2; --ink:#3a1f2b; --accent:#ff5a7a; --chip:#ffffffcc;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg1);font-family:"DM Sans",system-ui,sans-serif;color:var(--ink);
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body{background:radial-gradient(120% 90% at 50% 0%,var(--bg1) 0%,#ffe9d6 55%,var(--bg2) 100%)}
  #gallery{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--bg1)}
  #gallery img{position:absolute;top:0;left:0;height:100%;width:auto;will-change:transform;display:block;user-select:none;pointer-events:none}
  #g0{transform:translateX(calc(100vw - 100%))}
  #stkBtn{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top));z-index:3;font:400 17px "Bagel Fat One",system-ui;color:#fff;
    background:#c2185b;border:3px solid #2a1520;border-radius:14px;padding:9px 14px 8px;box-shadow:4px 4px 0 #2a1520;cursor:pointer;
    transform:rotate(-6deg);animation:stkWiggle 5s ease-in-out infinite;text-decoration:none;display:flex;align-items:center;gap:7px;letter-spacing:.3px}
  #stkBtn:hover{animation-play-state:paused;transform:rotate(-2deg) scale(1.08)}
  #stkBtn:active{transform:rotate(-2deg) translate(2px,2px);box-shadow:1px 1px 0 #2a1520}
  #stkBtn img{width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
  #stkBtn::after{content:"";position:absolute;right:-3px;top:-3px;width:16px;height:16px;background:linear-gradient(225deg,#ffe3ee 0 50%,transparent 50%);border-radius:0 11px 0 0}
  @keyframes stkWiggle{0%,82%,100%{transform:rotate(-6deg) scale(1)}85%{transform:rotate(4deg) scale(1.12)}88%{transform:rotate(-12deg) scale(1.12)}91%{transform:rotate(3deg) scale(1.08)}94%{transform:rotate(-8deg) scale(1.02)}}
  body.game #stkBtn{opacity:.55;transform:rotate(-6deg) scale(.85);animation:none}
  @media (max-width:420px){#stkBtn{font-size:15px;padding:7px 11px 6px}#stkBtn img{width:24px;height:24px}}
  .veil{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,rgba(255,244,227,.12),rgba(255,233,214,.28))}
  canvas{position:fixed;inset:0;z-index:1;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none;cursor:grab}
  canvas.grabbing{cursor:grabbing}
  #wet{z-index:1;pointer-events:none}
  .bar{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;z-index:2;max-width:calc(100vw - 24px)}
  .bar button,.bar label{font:700 13px "DM Sans",system-ui;color:var(--ink);background:var(--chip);border:2px solid var(--ink);
    border-radius:999px;padding:8px 14px;cursor:pointer;backdrop-filter:blur(6px);box-shadow:2px 2px 0 var(--ink);transition:transform .08s}
  .bar button:active,.bar label:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
  .bar .hot{background:#d81b60;color:#fff}
  .bar input{display:none}
  .drop{position:fixed;inset:12px;border:4px dashed var(--accent);border-radius:24px;display:none;align-items:center;justify-content:center;
    font-family:"Bagel Fat One";font-size:32px;color:var(--accent);background:#fff8;z-index:5;pointer-events:none}
  .drop.on{display:flex}
  body:not(.game) .game-only{display:none !important}
  body.game .pile-only{display:none !important}
  body.game canvas#c{cursor:none}
  .hud{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);z-index:2;display:flex;gap:14px;align-items:center;
    font:700 22px "DM Sans",system-ui;color:var(--ink);background:var(--chip);border:2px solid var(--ink);border-radius:999px;padding:6px 18px;box-shadow:2px 2px 0 var(--ink);pointer-events:none}
  .hud #lives{color:var(--accent);letter-spacing:3px;font-size:20px}
  .over{position:fixed;inset:0;z-index:4;display:none;align-items:center;justify-content:center;background:rgba(58,31,43,.35)}
  .over.on{display:flex}
  .hint{position:fixed;inset:0;z-index:3;display:none;align-items:center;justify-content:center;background:rgba(40,28,36,.55);opacity:0;transition:opacity .25s}
  .hint.on{display:flex;opacity:1}
  .hint .hcard{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;text-align:center}
  .hint b{font:400 30px "Bagel Fat One",system-ui;text-shadow:3px 3px 0 #3a1f2b}
  .hint small{font:700 14px "DM Sans",system-ui;opacity:.85}
  .hint .swipe{position:relative;width:150px;height:70px}
  .hint .swipe::before{content:"";position:absolute;left:10px;right:10px;top:34px;height:4px;border-radius:2px;background:rgba(255,255,255,.5)}
  .hint .swipe span{position:absolute;top:8px;left:0;font-size:44px;animation:swipe 1s ease-in-out infinite}
  @keyframes swipe{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(105px);opacity:0}}
  body:not(.blocks) .blocks-only{display:none !important}
  body:not(.snake) .snake-only{display:none !important}
  body.blocks .pong-only{display:none !important}
  .pad{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom));z-index:2;display:flex;gap:10px}
  .pad button{width:58px;height:58px;font:700 24px system-ui;color:var(--ink);background:var(--chip);border:2px solid var(--ink);border-radius:16px;box-shadow:2px 2px 0 var(--ink);cursor:pointer;touch-action:manipulation;user-select:none}
  .pad button:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
  @media (hover:hover) and (pointer:fine){ .pad{display:none !important} }
  .over .card{background:#fff8ef;border:3px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--ink);padding:26px 30px;text-align:center;max-width:86vw}
  .over h2{font:400 44px "Bagel Fat One",system-ui;color:var(--accent);text-shadow:3px 3px 0 var(--ink);margin-bottom:6px}
  .over p{font:700 18px "DM Sans",system-ui;margin-bottom:18px}
  .over .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .over button{font:700 15px "DM Sans",system-ui;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:999px;padding:10px 18px;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
  .over button.hot{background:#d81b60;color:#fff}
  .toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:700;font-size:13px;
    padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .3s;z-index:6;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>
<body>
<div id="gallery"><img id="g0" src="images/gallery/wolf-wang.webp" alt="" fetchpriority="high" width="1500" height="1497"></div>
<div class="veil"></div>
<canvas id="c"></canvas>
<canvas id="wet"></canvas>
<a id="stkBtn" href="https://www.redbubble.com/people/TheCockpile/shop" target="_blank" rel="noopener"><img src="images/stk-icon.webp" alt="" width="30" height="30">STICKERS!</a>
<div class="bar">
  <button id="rain" class="hot pile-only">Make it rain</button>
  <button id="pong" class="pile-only">Play Pong</button>
  <button id="stack" class="pile-only">Stack 'Em</button>
  <button id="snake" class="pile-only">Snake</button>
  <button id="quest" class="pile-only">Cock Quest</button>
  <button id="coomBtn" class="pile-only hot">COOM</button>
  <button id="dkBtn" class="pile-only">Donkey Cock</button>
  <button id="cfBtn" class="pile-only hot">Cockfight</button>
  <button id="back" class="game-only">Back to the pile</button>
  <button id="sound">Sound: on</button>
  <button id="clear" class="pile-only">Clear</button>
</div>
<div class="hud game-only" id="hud"><span id="score">0</span><span id="lives"></span></div>
<div class="pad blocks-only" id="pad">
  <button data-k="left" aria-label="Left">◀</button><button data-k="rot" aria-label="Rotate">⟳</button><button data-k="right" aria-label="Right">▶</button><button data-k="drop" aria-label="Drop">⤓</button>
</div>
<div class="pad snake-only" id="spad">
  <button data-d="left" aria-label="Left">◀</button><button data-d="up" aria-label="Up">▲</button><button data-d="down" aria-label="Down">▼</button><button data-d="right" aria-label="Right">▶</button>
</div>
<div class="hint" id="snakeHint"><div class="hcard"><div class="swipe"><span>☝</span></div><b>Swipe to steer</b><small>or use the arrows below</small></div></div>
<div class="over" id="over"><div class="card"><h2>Game over</h2><p id="final"></p><div class="row"><button id="again" class="hot">Play again</button><button id="quit">Back to the pile</button></div></div></div>
<div class="drop" id="drop">Drop your cut-outs</div>
<div class="toast" id="toast"></div>

<script defer src="js/main.js"></script>
<script defer src="js/stickers.js"></script>
<script>
// the bigger games only load when you open them
const loadGame = (src, name) => window[name] ? Promise.resolve(window[name]) : new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = () => res(window[name]); s.onerror = rej; document.head.appendChild(s); });
document.getElementById('quest').onclick = () => loadGame('js/rpg.js', 'CockQuest').then(g => g && g.open());
document.getElementById('coomBtn').onclick = () => loadGame('js/coom.js', 'Coom').then(g => g && g.open());
document.getElementById('dkBtn').onclick = () => loadGame('js/dcock.js', 'DonkeyCock').then(g => g && g.open());
document.getElementById('cfBtn').onclick = () => loadGame('js/cockfight.js', 'Cockfight').then(g => g && g.open());
addEventListener('load', () => setTimeout(() => ['js/rpg.js', 'js/coom.js', 'js/dcock.js', 'js/cockfight.js'].forEach(href => { const l = document.createElement('link'); l.rel = 'prefetch'; l.href = href; document.head.appendChild(l); }), 4000));
</script>
</body>
</html>
