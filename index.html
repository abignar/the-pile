<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Pile</title>
<meta name="description" content="They just keep falling.">
<meta property="og:title" content="The Pile">
<meta property="og:description" content="They just keep falling.">
<meta property="og:url" content="https://cockpile.com/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://cockpile.com/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<script src="js/planck.min.js"></script>
<style>
  :root{
    --bg1:#fff4e3; --bg2:#ffd9c2; --ink:#3a1f2b; --accent:#ff5a7a; --chip:#ffffffcc;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg1);font-family:"DM Sans",system-ui,sans-serif;color:var(--ink);
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body{background:radial-gradient(120% 90% at 50% 0%,var(--bg1) 0%,#ffe9d6 55%,var(--bg2) 100%)}
  #gallery{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--bg1)}
  #gallery img{position:absolute;top:0;left:0;height:100%;width:auto;will-change:transform;display:block;user-select:none;pointer-events:none}
  .veil{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,rgba(255,244,227,.12),rgba(255,233,214,.28))}
  canvas{position:fixed;inset:0;z-index:1;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none;cursor:grab}
  canvas.grabbing{cursor:grabbing}
  #wet{z-index:1;pointer-events:none}
  .bar{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;z-index:2;max-width:calc(100vw - 24px)}
  .bar button,.bar label{font:700 13px "DM Sans",system-ui;color:var(--ink);background:var(--chip);border:2px solid var(--ink);
    border-radius:999px;padding:8px 14px;cursor:pointer;backdrop-filter:blur(6px);box-shadow:2px 2px 0 var(--ink);transition:transform .08s}
  .bar button:active,.bar label:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
  .bar .hot{background:var(--accent);color:#fff}
  .bar input{display:none}
  .drop{position:fixed;inset:12px;border:4px dashed var(--accent);border-radius:24px;display:none;align-items:center;justify-content:center;
    font-family:"Bagel Fat One";font-size:32px;color:var(--accent);background:#fff8;z-index:5;pointer-events:none}
  .drop.on{display:flex}
  .toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:700;font-size:13px;
    padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .3s;z-index:6;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>
<body>
<div id="gallery"></div>
<div class="veil"></div>
<canvas id="c"></canvas>
<canvas id="wet"></canvas>
<div class="bar">
  <button id="rain" class="hot">Make it rain</button>
  <button id="clear">Clear</button>
</div>
<div class="drop" id="drop">Drop your cut-outs</div>
<div class="toast" id="toast"></div>

<script>
const CUTOUTS = [
  "images/cockodile.webp",
  "images/donald-dick.webp",
  "images/kermit-the-cock.webp",
  "images/wolf-wang.webp",
  "images/iron-cock.webp",
  "images/cocker-pillar.webp",
  "images/cockacoka.webp",
  "images/dick-vader.webp",
  "images/penisaurus-rex.webp",
];

// Background gallery: one continuous reel scrolling left to right, in random order.
// GALLERY_SECONDS = roughly how long each image takes to pass.
const GALLERY_SECONDS = 9;
const GALLERY = [
  "images/gallery/beverly-hills-cock.jpg",
  "images/gallery/cock-fight.jpg",
  "images/gallery/cockacoka.jpg",
  "images/gallery/cockanaught.jpg",
  "images/gallery/cockapillar.jpg",
  "images/gallery/cockasaurus.jpg",
  "images/gallery/cockburster.jpg",
  "images/gallery/cockfish.jpg",
  "images/gallery/cocknan-the-ball-barian.jpg",
  "images/gallery/cockness-monster.jpg",
  "images/gallery/cockodile.jpg",
  "images/gallery/cockzilla.jpg",
  "images/gallery/count-cockula.jpg",
  "images/gallery/dick-vader-colour.jpg",
  "images/gallery/dickachu.jpg",
  "images/gallery/dickvader.jpg",
  "images/gallery/donald-dick.jpg",
  "images/gallery/frankendick.jpg",
  "images/gallery/ironcock.jpg",
  "images/gallery/kermit-the-cock.jpg",
  "images/gallery/lolli-cock.jpg",
  "images/gallery/my-little-penis.jpg",
  "images/gallery/octo-cock.jpg",
  "images/gallery/penisaurus-rex.jpg",
  "images/gallery/robodick.jpg",
  "images/gallery/wolf-wang.jpg",
  "images/gallery/womb-raider.jpg",
];

(() => {
  const pl = planck, { Vec2, Circle, Box, RevoluteJoint, WeldJoint, MouseJoint } = pl;

  // ================================================================
  // FEEL — tweak these to change how the pile behaves
  // ================================================================
  const FEEL = {
    floppiness: 3.6,   // Hz of the springy joints: lower = floppier (1 = limp noodle, 6 = stiff)
    bounce: 0.35,      // spring damping: lower = more wobble after a knock
    maxBend: 0.42,     // most any one joint can fold (radians, ~24°) so bends stay smooth
    squirm: 1,         // how lively the occasional squirm is (0 = never squirm)
    fallDrag: 1.4,     // air drag while falling: higher = slower, floatier fall
    grabSize: 1.75,    // how much bigger a grabbed piece gets
    throwSpeed: 900,   // fling faster than this (pixels/sec) and it flies off and disappears
    trailSeconds: 6,   // how long a thrown one's smear stays on screen
  };

  // ---------- canvas ----------
  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: true }) || null;
  const ctx = gl ? null : canvas.getContext('2d');
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0;
  const S = 50; // pixels per physics metre
  const DEBUG = location.hash === '#debug';

  // ---------- world ----------
  const world = new pl.World({ gravity: Vec2(0, 14) });
  const ground = world.createBody();
  let wallFixtures = [];
  function buildWalls() {
    wallFixtures.forEach(f => ground.destroyFixture(f));
    const w = W / S, h = H / S, t = 4;
    wallFixtures = [
      ground.createFixture(new Box(w * 1.5, t, Vec2(w / 2, h + t), 0), { friction: 0.9 }),
      ground.createFixture(new Box(t, h * 3, Vec2(-t, -h * 0.5), 0), { friction: 0.3 }),
      ground.createFixture(new Box(t, h * 3, Vec2(w + t, -h * 0.5), 0), { friction: 0.3 }),
    ];
  }

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    buildWalls();
    // pull anything outside back in
    for (const d of dicks) {
      if (d.thrown) continue;
      for (const st of d.strips) {
        const p = st.body.getPosition();
        if (p.x * S < 0 || p.x * S > W || p.y * S > H) {
          st.body.setPosition(Vec2(Math.min(Math.max(p.x * S, 60), W - 60) / S, Math.min(p.y * S, H - 120) / S));
          st.body.setAwake(true);
        }
      }
    }
  }

  // ---------- pieces ----------
  const images = [];
  const dicks = [];
  let nextId = 1;
  const baseSize = () => (W < 700 ? Math.max(30, W / 8.5) : Math.min(W, 1100) / 13);

  function makeFixtures(st, k) {
    for (let f = st.body.getFixtureList(); f; ) { const n = f.getNext(); st.body.destroyFixture(f); f = n; }
    for (const c of st.circles) {
      st.body.createFixture(new Circle(Vec2((c.x - st.com.x) * k / S, (c.y - st.com.y) * k / S), c.r * k / S), {
        density: 1, friction: 0.75, restitution: 0.04,
        filterGroupIndex: st.group, filterMaskBits: st.mask,
      });
    }
  }

  function spawn(x, y, opts = {}) {
    const sk = images[Math.floor(Math.random() * images.length)];
    const longest = baseSize() * 2.1 * (0.8 + Math.random() * 0.4);
    const k = longest / Math.max(sk.w, sk.h);
    const cx = sk.w / 2, cy = sk.h / 2;
    const ang = (Math.random() - 0.5) * Math.PI * 1.4, ca = Math.cos(ang), sa = Math.sin(ang);
    const toWorld = p => { const dx = (p.x - cx) * k, dy = (p.y - cy) * k; return Vec2((x + dx * ca - dy * sa) / S, (y + dx * sa + dy * ca) / S); };
    const group = -nextId; // parts of the same piece never collide with each other
    const strips = sk.segs.map(seg => {
      let ax = 0, ay = 0, aw = 0;
      seg.circles.forEach(c => { const w = c.r * c.r; ax += c.x * w; ay += c.y * w; aw += w; });
      const com = { x: ax / aw, y: ay / aw };
      const body = world.createDynamicBody({ position: toWorld(com), angle: ang, linearDamping: FEEL.fallDrag, angularDamping: 0.6 });
      const st = { body, com, circles: seg.circles, group, mask: 0xffff };
      makeFixtures(st, k);
      return st;
    });
    const joints = sk.joints.map((j, i) => {
      const A = strips[i].body, B = strips[i + 1].body, anchor = toWorld(j.mid);
      const hinge = world.createJoint(new RevoluteJoint({ referenceAngle: 0, enableLimit: true, lowerAngle: -FEEL.maxBend, upperAngle: FEEL.maxBend,
        enableMotor: false, maxMotorTorque: 0 }, A, B, anchor));
      const spring = world.createJoint(new WeldJoint({ referenceAngle: 0, frequencyHz: FEEL.floppiness, dampingRatio: FEEL.bounce }, A, B, anchor));
      return { hinge, spring, mid: j.mid };
    });
    const v = Vec2((Math.random() - 0.5) * 1.5, (opts.vy ?? 0.5) * 3);
    const spin = (Math.random() - 0.5) * 1.5;
    strips.forEach(st => { st.body.setLinearVelocity(v); st.body.setAngularVelocity(spin); });
    let mass = 0; strips.forEach(st => mass += st.body.getMass());
    const d = { id: nextId++, mass, strips, joints, img: sk, k, k0: k, scale: 1, target: 1, held: false, thrown: false, wig: 0, phase: Math.random() * 6 };
    strips.forEach(st => st.body.setUserData(d));
    dicks.push(d);
    return d;
  }

  function removeDick(d) {
    d.joints.forEach(j => { world.destroyJoint(j.hinge); world.destroyJoint(j.spring); });
    d.strips.forEach(st => world.destroyBody(st.body));
    dicks.splice(dicks.indexOf(d), 1);
    if (held === d) release();
  }

  // grow/shrink a whole piece about a point (fixtures and joints rebuilt at the new size)
  function scalePiece(d, f, about) {
    const c = about || d.strips[d.strips.length >> 1].body.getPosition();
    d.k *= f;
    for (const st of d.strips) {
      const p = st.body.getPosition();
      st.body.setPosition(Vec2(c.x + (p.x - c.x) * f, c.y + (p.y - c.y) * f));
      makeFixtures(st, d.k);
    }
    d.joints.forEach((j, i) => {
      world.destroyJoint(j.hinge); world.destroyJoint(j.spring);
      const A = d.strips[i].body, B = d.strips[i + 1].body;
      // the joint sits where the two slices meet: take it from slice A's frame
      const ap = A.getWorldPoint(Vec2((j.mid.x - d.strips[i].com.x) * d.k / S, (j.mid.y - d.strips[i].com.y) * d.k / S));
      j.hinge = world.createJoint(new RevoluteJoint({ referenceAngle: 0, enableLimit: true, lowerAngle: -FEEL.maxBend, upperAngle: FEEL.maxBend }, A, B, ap));
      j.spring = world.createJoint(new WeldJoint({ referenceAngle: 0, frequencyHz: FEEL.floppiness, dampingRatio: FEEL.bounce }, A, B, ap));
    });
    d.strips.forEach(st => st.body.setAwake(true));
  }

  function setMask(d, mask) {
    for (const st of d.strips) { st.mask = mask; for (let f = st.body.getFixtureList(); f; f = f.getNext()) f.setFilterData({ groupIndex: st.group, categoryBits: 1, maskBits: mask }); }
  }

  // ---------- spawning over time ----------
  function capacity() {
    const avgArea = 1.14 * 1.75 * baseSize() ** 2;
    return Math.round(Math.max(25, Math.min(200, (W * H * 0.65) / avgArea)));
  }
  const t0 = performance.now();
  let spawnTimer = 0;
  const spawnInterval = () => Math.max(350, 1700 - (performance.now() - t0) / 60000 * 450);
  function dropOne(vy) {
    const m = baseSize();
    spawn(m + Math.random() * (W - m * 2), -baseSize() * 2.4, { vy });
  }

  // ---------- grabbing & throwing ----------
  let held = null, mouseJoint = null, grabStrip = null;
  const pointer = { x: 0, y: 0, hist: [] };
  function pick(px, py) {
    const p = Vec2(px / S, py / S); let hit = null;
    world.queryAABB(new pl.AABB(Vec2(p.x - 0.01, p.y - 0.01), Vec2(p.x + 0.01, p.y + 0.01)), f => {
      const b = f.getBody(); if (b.isDynamic() && f.testPoint(p) && b.getUserData() && !b.getUserData().thrown) { hit = b; return false; } return true;
    });
    if (hit) return hit;
    // forgiving touch: nearest piece within a finger's width
    let best = null, bd = (W < 700 ? 30 : 16) / S;
    for (const d of dicks) if (!d.thrown) for (const st of d.strips) for (let f = st.body.getFixtureList(); f; f = f.getNext()) {
      const sh = f.getShape(), c = st.body.getWorldPoint(sh.getCenter()), dist = Math.hypot(c.x - p.x, c.y - p.y) - sh.getRadius();
      if (dist < bd) { bd = dist; best = st.body; }
    }
    return best;
  }
  canvas.addEventListener('pointerdown', e => {
    pointer.x = e.clientX; pointer.y = e.clientY; pointer.hist = [{ x: e.clientX, y: e.clientY, t: performance.now() }];
    const b = pick(e.clientX, e.clientY); if (!b) return;
    const d = b.getUserData();
    canvas.setPointerCapture(e.pointerId);
    held = d; grabStrip = b; d.held = true; d.target = FEEL.grabSize; d.wig = 0;
    d.strips.forEach(st => st.body.setAwake(true));
    let mass = 0; d.strips.forEach(st => mass += st.body.getMass());
    mouseJoint = world.createJoint(new MouseJoint({ maxForce: 600 * mass, frequencyHz: 6, dampingRatio: 0.8 }, ground, b, Vec2(e.clientX / S, e.clientY / S)));
    canvas.classList.add('grabbing');
  });
  canvas.addEventListener('pointermove', e => {
    pointer.x = e.clientX; pointer.y = e.clientY;
    pointer.hist.push({ x: e.clientX, y: e.clientY, t: performance.now() });
    if (pointer.hist.length > 8) pointer.hist.shift();
    if (mouseJoint) mouseJoint.setTarget(Vec2(e.clientX / S, e.clientY / S));
  });
  function release() {
    if (mouseJoint) { world.destroyJoint(mouseJoint); mouseJoint = null; }
    if (held) { held.held = false; held.target = 1; }
    held = null; grabStrip = null; canvas.classList.remove('grabbing');
  }
  function endDrag() {
    if (!held) return;
    // fling speed: from the last bit of pointer movement, or how fast the grabbed piece itself is moving
    const h = pointer.hist, now = performance.now();
    let vx = 0, vy = 0;
    if (h.length >= 2 && now - h[h.length - 1].t < 300) {
      const b = h[h.length - 1]; let a = h[h.length - 2];
      for (let i = h.length - 2; i >= 0 && b.t - h[i].t < 150; i--) a = h[i];
      const dt = Math.max(16, b.t - a.t) / 1000; vx = (b.x - a.x) / dt; vy = (b.y - a.y) / dt;
    }
    if (grabStrip) { const bv = grabStrip.getLinearVelocity(); if (Math.hypot(bv.x, bv.y) * S > Math.hypot(vx, vy)) { vx = bv.x * S; vy = bv.y * S; } }
    const d = held;
    release();
    if (Math.hypot(vx, vy) > FEEL.throwSpeed) {
      d.thrown = true; d.target = 1;
      setMask(d, 0); // flies through everything
      d.strips.forEach(st => { st.body.setLinearDamping(0); st.body.setLinearVelocity(Vec2(vx * 1.4 / S, vy * 1.4 / S)); st.body.setAngularVelocity((Math.random() - 0.5) * 8); });
    }
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // ---------- per-step logic ----------
  function stepLogic(dt) {
    const t = performance.now() / 1000;
    for (const d of dicks) {
      // smooth grow / shrink (really grows, so it shoves neighbours away)
      if (Math.abs(d.target - d.scale) > 0.004) {
        const next = d.scale + (d.target - d.scale) * 0.18;
        scalePiece(d, next / d.scale, grabStrip && d.held ? grabStrip.getPosition() : null);
        d.scale = next;
      }
      // landed pieces lose their floaty fall drag so they slump naturally
      const mid = d.strips[d.strips.length >> 1].body;
      const fast = mid.getLinearVelocity().length() * S > 250;
      if (!d.thrown) d.strips.forEach(st => st.body.setLinearDamping(fast && !d.held ? FEEL.fallDrag : 0.15));
      // squirm: joint motors run a wave down the body now and then
      if (FEEL.squirm > 0 && !d.held && !d.thrown) {
        if (d.wig > 0) {
          d.wig -= dt;
          d.joints.forEach((j, i) => {
            j.hinge.enableMotor(true);
            j.hinge.setMaxMotorTorque(d.mass * 6 * FEEL.squirm * d.scale * d.scale);
            j.hinge.setMotorSpeed(Math.sin(t * 7 + i * 1.3 + d.phase) * 3.2 * FEEL.squirm);
          });
          if (d.wig <= 0) d.joints.forEach(j => j.hinge.enableMotor(false));
          d.strips.forEach(st => st.body.setAwake(true));
        } else if (Math.random() < dt / 7) d.wig = 0.7 + Math.random() * 1.1;
      }
    }
  }

  // ---------- drawing ----------
  // ---------- drawing ----------
  // WebGL: each piece is a strip of triangles over its image, bent smoothly by the slices' positions
  let prog, buf, uRes, uOff, uAlpha, aPos, aUV;
  if (gl) {
    const sh = (type, src) => { const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o); return o; };
    prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, `attribute vec2 aPos; attribute vec2 aUV; uniform vec2 uRes; uniform vec2 uOff; varying vec2 vUV;
      void main(){ vec2 p = (aPos + uOff) / uRes * 2.0 - 1.0; gl_Position = vec4(p.x, -p.y, 0.0, 1.0); vUV = aUV; }`));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, `precision mediump float; uniform sampler2D uTex; uniform float uAlpha; varying vec2 vUV;
      void main(){ gl_FragColor = texture2D(uTex, vUV) * uAlpha; }`));
    gl.linkProgram(prog); gl.useProgram(prog);
    buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    aPos = gl.getAttribLocation(prog, 'aPos'); aUV = gl.getAttribLocation(prog, 'aUV');
    gl.enableVertexAttribArray(aPos); gl.enableVertexAttribArray(aUV);
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 16, 0); gl.vertexAttribPointer(aUV, 2, gl.FLOAT, false, 16, 8);
    uRes = gl.getUniformLocation(prog, 'uRes'); uOff = gl.getUniformLocation(prog, 'uOff'); uAlpha = gl.getUniformLocation(prog, 'uAlpha');
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  }
  function makeTexture(img) {
    if (!gl) return null;
    // power-of-two copy so it can be mipmapped (crisp when shrunk)
    const n = Math.min(1024, 1 << Math.ceil(Math.log2(Math.max(img.width, img.height, 2))));
    const cv = document.createElement('canvas'); cv.width = cv.height = n;
    cv.getContext('2d').drawImage(img, 0, 0, n, n);
    const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  }
  let verts = new Float32Array(1024);
  function pieceVerts(d) {
    const sk = d.img, m = sk.mesh, n = m.length, out = new Float32Array(n * 4);
    const T = d.strips.map(st => { const p = st.body.getPosition(), a = st.body.getAngle(); return { x: p.x * S, y: p.y * S, c: Math.cos(a) * d.k, s: Math.sin(a) * d.k, cx: st.com.x, cy: st.com.y }; });
    for (let i = 0; i < n; i++) {
      const v = m[i], A = T[v.a], Bt = T[v.b];
      const ax = v.x - A.cx, ay = v.y - A.cy, bx = v.x - Bt.cx, by = v.y - Bt.cy;
      const wx = A.x + ax * A.c - ay * A.s, wy = A.y + ax * A.s + ay * A.c;
      const zx = Bt.x + bx * Bt.c - by * Bt.s, zy = Bt.y + bx * Bt.s + by * Bt.c;
      out[i * 4] = wx + (zx - wx) * v.wb; out[i * 4 + 1] = wy + (zy - wy) * v.wb;
      out[i * 4 + 2] = v.x / sk.w; out[i * 4 + 3] = v.y / sk.h;
    }
    return out;
  }
  function drawVerts(tex, v, alpha) {
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.bufferData(gl.ARRAY_BUFFER, v, gl.DYNAMIC_DRAW);
    gl.uniform1f(uAlpha, alpha);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, v.length / 4);
  }
  function drawPieceGL(d) {
    const v = pieceVerts(d);
    drawVerts(d.img.tex, v, 1);
  }
  // ---------- liquid smear for thrown pieces ----------
  const wetCv = document.getElementById('wet'), wet = wetCv.getContext('2d');
  const smears = [];
  const scr = document.createElement('canvas'), sc = scr.getContext('2d');
  function tintOf(img) { // average colour of the drawing, to tint its slime a little
    const c = document.createElement('canvas'); c.width = c.height = 8; const x = c.getContext('2d');

      if (s2 > 0 && u - B[s2] < lenL * 0.4) { const hz = lenL * 0.4; a = s2 - 1; b = s2; wb = ss(Math.min(1, (u - (B[s2] - hz)) / (2 * hz))); }
      else if (s2 < nSeg - 1 && B[s2 + 1] - u < lenR * 0.4) { const hz = lenR * 0.4; a = s2; b = s2 + 1; wb = ss(Math.max(0, (u - (B[s2 + 1] - hz)) / (2 * hz))); }
      for (const v of [vLo, vHi]) { const p = toImg(u, v); rows.push({ x: p.x, y: p.y, a, b, wb }); }
    }
    return { img, w: img.width, h: img.height, segs, joints, e1, e2, mesh: rows };
  }


  // ---------- background gallery: one continuous reel, left to right ----------
  (function gallery() {
    const box = document.getElementById('gallery');
    if (!GALLERY.length) { box.style.display = 'none'; return; }
    const order = [...GALLERY].sort(() => Math.random() - 0.5);
    const reel = []; // { el, x, w }, ordered right-most first
    let speed = 0, lastT = performance.now();
    const widthOf = r => r.el.naturalWidth / r.el.naturalHeight * innerHeight;
    function add(el) {
      // join on the left end of the reel
      const w = el.naturalWidth / el.naturalHeight * innerHeight;
      const left = reel.length ? Math.min(...reel.map(r => r.x)) : innerWidth;
      reel.push({ el, x: left - w, w });
      box.appendChild(el);
      const avg = reel.reduce((a, r) => a + r.w, 0) / reel.length;
      speed = avg / GALLERY_SECONDS;
    }
    // load in order; each joins the reel as soon as it's ready
    (async () => { for (const src of order) await new Promise(res => { const im = new Image(); im.alt = ''; im.decoding = 'async'; im.onload = () => { add(im); res(); }; im.onerror = res; im.src = src; }); })();
    function tick(t) {
      const dt = Math.min(0.1, (t - lastT) / 1000); lastT = t;
      if (reel.length) {
        for (const r of reel) r.x += speed * dt;
        // anything that has slid off the right edge goes back to the left end (only once the reel is wider than the screen)
        const total = reel.reduce((a, r) => a + r.w, 0);
        if (total > innerWidth + 50) for (const r of reel) if (r.x > innerWidth) { r.x = Math.min(...reel.map(q => q.x)) - r.w; }
        for (const r of reel) r.el.style.transform = `translate3d(${r.x.toFixed(1)}px,0,0)`;
      }
      requestAnimationFrame(tick);
    }
    addEventListener('resize', () => {
      // keep the right-most image where it is and re-pack the rest at the new height
      const sorted = reel.slice().sort((a, b) => b.x - a.x); let x = null;
      for (const r of sorted) { r.w = widthOf(r); r.x = x === null ? r.x : x - r.w; x = r.x; }
    });
    requestAnimationFrame(tick);
  })();

  function loadCutouts() {
    const list = CUTOUTS.length ? CUTOUTS : ['favicon.svg'];
    return Promise.all(list.map(src => new Promise(res => {
      const img = new Image();
      img.onload = async () => {
        if (!img.width) { img.width = img.height = 256; }
        const sk = analyse(img);
        // slices as ImageBitmaps draw fastest
        if (window.createImageBitmap) try { await Promise.all(sk.segs.map(async sg => { sg.sprite = await createImageBitmap(sg.sprite); })); } catch (e) {}
        sk.tex = makeTexture(img); sk.tint = tintOf(img); images.push(sk); res();
      };
      img.onerror = () => { console.warn('Could not load', src); res(); };
      img.src = src;
    })));
  }

  window.addEventListener('resize', resize);
  resize();
  loadCutouts().then(() => {
    for (let i = 0; i < 4; i++) setTimeout(() => dropOne(), 200 + i * 500);
    requestAnimationFrame(t => { last = t; frame(t); });
  });
  window.__pile = { dicks, world, dropOne, S }; // for testing
})();
</script>
